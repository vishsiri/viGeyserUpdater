name: viGeyserUpdater
version: '${version}'
main: dev.visherryz.vigeyserupdater.bukkit.ViGeyserUpdaterPlugin
api-version: '1.20'
load: STARTUP
loadbefore: [floodgate, Geyser-Spigot, GeyserModelEngine, GeyserUtils]
folia-supported: true
authors: [VisherRyz]
description: Crash-safe automatic updater for Geyser companion plugins and extensions
commands:
  geyserupdates:
    description: Check and install Geyser companion updates
    usage: /geyserupdates <status|check|update|reload> [artifact|all]
    aliases: [gupdates]
    permission: vigeyserupdater.admin
permissions:
  vigeyserupdater.admin:
    default: op
